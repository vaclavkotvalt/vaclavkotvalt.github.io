name: Dočasná kontrola zdrojů dat
on:
  push:
    branches: [claude/quarterly-macroeconomic-similarity-pa7n02]
    paths: [".github/workflows/probe-sources.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in "https://shillerdata.com/" \
                   "https://img1.wsimg.com/blobby/go/e5e77e0b-59d1-44d9-ab25-4763ac982e53/downloads/ie_data.xls" \
                   "https://www.multpl.com/s-p-500-pe-ratio/table/by-month" \
                   "https://www.multpl.com/s-p-500-earnings/table/by-month" \
                   "https://www.aaii.com/files/surveys/sentiment.xls"; do
            curl -sS -L -A "$UA" -m 30 -o /tmp/out -w "%{http_code} %{size_download}B %{content_type} $u\n" "$u" || echo "FAIL $u"
            head -c 300 /tmp/out | tr -c '[:print:]' '.'; echo
          done
          curl -sS -L -A "$UA" -m 30 https://shillerdata.com/ | grep -o 'https://[^"]*\.xls[^"]*' | sort -u
          curl -sS -L -A "$UA" -m 30 "https://www.multpl.com/s-p-500-pe-ratio/table/by-month" | grep -A3 '<td' | head -20
