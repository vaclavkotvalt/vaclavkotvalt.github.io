name: Aplikace Hudba pro Android (APK)

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "hudba/style.css"
      - "hudba/icons.js"
      - "hudba/fonts/**"
      - "hudba/icons/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Podpisový klíč z tajných údajů
        env:
          KEYSTORE: ${{ secrets.HUDBA_KEYSTORE }}
          PASSWORD: ${{ secrets.HUDBA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Chybí tajné údaje HUDBA_KEYSTORE a HUDBA_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/hudba.keystore"
          echo "HUDBA_KEYSTORE_FILE=$RUNNER_TEMP/hudba.keystore" >> "$GITHUB_ENV"
      - name: Sestavit APK
        env:
          HUDBA_KEYSTORE_PASSWORD: ${{ secrets.HUDBA_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle -p android assembleRelease --no-daemon 2>&1 | tee build.log; then
            # chyby jako hlášení u sestavení, aby byly vidět i bez stahování celého protokolu
            msg=$(grep -E "^e: |error:|What went wrong|^> " build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Sestavení selhalo::${msg:-viz protokol}"
            exit 1
          fi
      - name: Zveřejnit APK ke stažení
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk hudba.apk
          gh release delete hudba-apk --yes --cleanup-tag || true
          gh release create hudba-apk hudba.apk \
            --target "${{ github.sha }}" \
            --title "Hudba – aplikace pro Android (verze 1.${{ github.run_number }})" \
            --notes "Přehrávač hudby z vaclavkotvalt.cz/hudba jako aplikace pro Android. Stáhněte hudba.apk v telefonu a nainstalujte (novější verze se nainstaluje přes tu starou)."
