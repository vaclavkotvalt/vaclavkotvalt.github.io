name: Aktualizace makrodat (kvartaly)

on:
  schedule:
    - cron: "17 6 * * 1"   # každé pondělí ráno
  workflow_dispatch:
  push:
    paths:
      - "kvartaly/scripts/**"
      - ".github/workflows/update-macro-data.yml"

permissions:
  contents: write

concurrency:
  group: macro-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout data z FRED
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python kvartaly/scripts/build_data.py
      - name: Uložit změny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kvartaly/data.json
          if git diff --cached --quiet; then
            echo "Žádné nové údaje."
          else
            git commit -m "Aktualizace makrodat pro kvartaly"
            git push
          fi
